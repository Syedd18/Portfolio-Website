<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Syed Muhammad Rizvi — AI Engineer</title>
<meta name="description" content="AI/ML Engineer & Full-Stack Developer. Building intelligent systems."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,300;12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
:root {
  --black: #030303;
  --white: #f5f2ee;
  --off: #e8e3db;
  --acid: #b8ff47;
  --acid-dim: rgba(184,255,71,0.12);
  --gray1: #0f0f0f;
  --gray2: #1a1a1a;
  --gray3: #2e2e2e;
  --gray4: #555;
  --gray5: #888;
  --gray6: #aaa;
  --f-display: 'Bebas Neue', sans-serif;
  --f-serif: 'DM Serif Display', serif;
  --f-body: 'Bricolage Grotesque', sans-serif;
  --f-mono: 'Geist Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--black);
  color: var(--white);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--black); }
::-webkit-scrollbar-thumb { background: var(--acid); }

/* CURSOR */
#cur {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transition: transform 0.1s;
}
#cur-dot {
  width: 10px; height: 10px;
  background: var(--acid);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
#cur-text {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--acid);
  letter-spacing: 0.1em;
  opacity: 0;
  transition: opacity 0.2s;
  transform: translate(16px, -50%);
}
#cur-trail {
  position: fixed;
  width: 40px; height: 40px;
  border: 1px solid rgba(184,255,71,0.25);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9997;
  transform: translate(-50%, -50%);
  transition: transform 0.25s cubic-bezier(0.23,1,0.32,1), width 0.3s, height 0.3s;
}

/* NOISE GRAIN */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9990;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* PROGRESS */
#prog {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: var(--acid);
  z-index: 10000;
  width: 0%;
  transition: width 0.05s linear;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  background: rgba(3,3,3,0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.nav-logo {
  font-family: var(--f-display);
  font-size: 22px;
  letter-spacing: 0.12em;
  color: var(--white);
  text-decoration: none;
}
.nav-links {
  display: flex;
  gap: 32px;
}
.nav-links a {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--white);
  text-decoration: none;
  opacity: 0.6;
  transition: opacity 0.2s;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 1px;
  background: var(--acid);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}
.nav-links a:hover { opacity: 1; }
.nav-links a:hover::after { transform: scaleX(1); }
.nav-menu-btn {
  display: none;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--white);
  background: none;
  border: 1px solid var(--gray3);
  padding: 8px 14px;
  cursor: pointer;
}

/* HERO */
#hero {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 40px 60px;
  position: relative;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(184,255,71,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(184,255,71,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
}
.hero-counter {
  position: absolute;
  top: 50%;
  right: 40px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  z-index: 2;
}
.hero-counter-num {
  font-family: var(--f-display);
  font-size: clamp(100px, 14vw, 200px);
  line-height: 0.85;
  color: transparent;
  -webkit-text-stroke: 1px rgba(184,255,71,0.12);
  letter-spacing: -0.02em;
  pointer-events: none;
}
.hero-eyebrow {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--acid);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 2;
  flex-wrap: wrap;
}
.hero-eyebrow::before {
  content: '';
  width: 32px; height: 1px;
  background: var(--acid);
}
.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 5px; height: 5px;
  background: var(--acid);
  border-radius: 50%;
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.hero-h1 {
  font-family: var(--f-display);
  font-size: clamp(58px, 10vw, 200px);
  line-height: 0.88;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--white);
  position: relative;
  z-index: 2;
  margin-bottom: 8px;
}
.hero-h1 .italic {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 0.82em;
  color: var(--acid);
  display: block;
  line-height: 1;
}
.hero-h1 .outlined {
  -webkit-text-stroke: 2px var(--white);
  color: transparent;
}

.hero-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 40px;
  position: relative;
  z-index: 2;
  gap: 20px;
  flex-wrap: wrap;
}
.hero-desc {
  max-width: 360px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--gray6);
  font-weight: 300;
  flex: 1;
  min-width: 220px;
}
.hero-stats {
  display: flex;
  gap: 32px;
  flex-shrink: 0;
}
.hero-stat { text-align: right; }
.hero-stat-val {
  font-family: var(--f-display);
  font-size: clamp(28px, 3.5vw, 42px);
  color: var(--white);
  line-height: 1;
  display: block;
}
.hero-stat-lbl {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray5);
  margin-top: 2px;
  display: block;
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--black);
  background: var(--acid);
  text-decoration: none;
  padding: 14px 28px;
  transition: transform 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  white-space: nowrap;
}
.hero-cta::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.15);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}
.hero-cta:hover { transform: translateY(-2px); }
.hero-cta:hover::after { transform: scaleX(1); }

.hero-scroll-hint {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 2;
  animation: scrollHint 2.5s ease-in-out infinite;
}
@keyframes scrollHint {
  0%,100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
  50% { opacity: 1; transform: translateX(-50%) translateY(8px); }
}
.scroll-line {
  width: 1px;
  height: 36px;
  background: linear-gradient(to bottom, transparent, var(--acid));
}
.scroll-label {
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--acid);
}

/* MARQUEE */
.marquee-section {
  border-top: 1px solid var(--gray3);
  border-bottom: 1px solid var(--gray3);
  overflow: hidden;
  padding: 16px 0;
  background: var(--gray1);
}
.marquee-track {
  display: flex;
  gap: 0;
  white-space: nowrap;
  animation: marquee 30s linear infinite;
}
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.marquee-item {
  display: inline-flex;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  font-family: var(--f-display);
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray4);
}
.marquee-dot {
  width: 4px; height: 4px;
  background: var(--acid);
  border-radius: 50%;
  flex-shrink: 0;
}

/* ABOUT */
#about {
  padding: 120px 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-bottom: 1px solid var(--gray3);
  position: relative;
  overflow: hidden;
}
.about-left {
  padding-right: 60px;
  border-right: 1px solid var(--gray3);
}
.about-right {
  padding-left: 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.section-tag {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--acid);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 40px;
}
.section-tag::before {
  content: attr(data-num);
  color: var(--gray4);
}
.about-h2 {
  font-family: var(--f-display);
  font-size: clamp(40px, 5vw, 96px);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 48px;
}
.about-h2 em {
  font-family: var(--f-serif);
  font-style: italic;
  color: var(--acid);
  display: block;
  font-size: 0.75em;
  line-height: 1.1;
}
.about-body {
  font-size: 15px;
  line-height: 1.8;
  color: var(--gray6);
  font-weight: 300;
  margin-bottom: 20px;
}
.about-body strong { color: var(--white); font-weight: 500; }
.about-cta {
  display: inline-block;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--white);
  text-decoration: none;
  padding: 12px 0;
  border-bottom: 1px solid var(--gray3);
  transition: color 0.2s, border-color 0.2s;
  margin-top: 32px;
  word-break: break-all;
}
.about-cta:hover { color: var(--acid); border-color: var(--acid); }

.about-info-stack { display: flex; flex-direction: column; gap: 1px; }
.info-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 0;
  border-bottom: 1px solid var(--gray3);
}
.info-row:first-child { border-top: 1px solid var(--gray3); }
.info-label {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gray4);
}
.info-val {
  font-size: 14px;
  color: var(--white);
  font-weight: 400;
}
.info-sub { font-size: 12px; color: var(--gray5); margin-top: 2px; }
.about-quote {
  font-family: var(--f-serif);
  font-style: italic;
  font-size: 18px;
  line-height: 1.5;
  color: var(--gray6);
  border-left: 2px solid var(--acid);
  padding-left: 20px;
  margin-top: 40px;
}

/* SKILLS */
#skills {
  padding: 120px 40px;
  background: var(--gray1);
  border-bottom: 1px solid var(--gray3);
  overflow: hidden;
}
.skills-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 60px;
  gap: 40px;
}
.skills-h2 {
  font-family: var(--f-display);
  font-size: clamp(48px, 7vw, 120px);
  line-height: 0.88;
  text-transform: uppercase;
  color: var(--white);
  flex: 1;
}
.skills-h2 span {
  -webkit-text-stroke: 1px var(--gray3);
  color: transparent;
  display: block;
}
.skills-desc {
  max-width: 280px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--gray5);
  padding-top: 8px;
  font-weight: 300;
}

.skills-orbit {
  position: relative;
  width: 100%;
}
.skill-category {
  margin-bottom: 1px;
  border: 1px solid var(--gray3);
  overflow: hidden;
  transition: border-color 0.3s;
}
.skill-category:hover { border-color: var(--acid); }
.skill-cat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  cursor: pointer;
  background: var(--gray2);
  transition: background 0.2s;
}
.skill-cat-name {
  font-family: var(--f-display);
  font-size: 18px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 16px;
}
.skill-cat-num {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--acid);
}
.skill-cat-arrow {
  font-family: var(--f-mono);
  font-size: 16px;
  color: var(--gray4);
  transition: transform 0.3s, color 0.2s;
}
.skill-category.open .skill-cat-arrow { transform: rotate(45deg); color: var(--acid); }
.skill-cat-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), padding 0.3s;
  padding: 0 28px;
}
.skill-category.open .skill-cat-body { max-height: 320px; padding: 0 28px 24px; }
.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--gray3);
}
.skill-tag {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--gray5);
  padding: 6px 14px;
  border: 1px solid var(--gray3);
  transition: color 0.2s, border-color 0.2s;
}
.skill-tag:hover { color: var(--acid); border-color: var(--acid); }

/* PROJECTS */
#projects {
  padding: 120px 40px;
  border-bottom: 1px solid var(--gray3);
}
.projects-header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: flex-end;
  margin-bottom: 60px;
  gap: 40px;
}
.projects-h2 {
  font-family: var(--f-display);
  font-size: clamp(48px, 8vw, 140px);
  line-height: 0.88;
  text-transform: uppercase;
  color: var(--white);
}
.projects-h2 .ghost {
  -webkit-text-stroke: 1px var(--gray3);
  color: transparent;
  display: block;
}
.projects-count {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--gray5);
  padding-bottom: 8px;
}

.project-item {
  border-top: 1px solid var(--gray3);
  padding: 40px 0;
  display: grid;
  grid-template-columns: 60px 1fr auto auto;
  gap: 32px;
  align-items: start;
  transition: background 0.2s;
  position: relative;
}
.project-item::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: var(--gray3);
}
.project-item:hover { background: rgba(184,255,71,0.02); }
.project-item:last-child { border-bottom: 1px solid var(--gray3); }
.proj-index {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--gray4);
  padding-top: 6px;
}
.proj-main {}
.proj-title-large {
  font-family: var(--f-display);
  font-size: clamp(24px, 3vw, 52px);
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--white);
  line-height: 1;
  margin-bottom: 14px;
  transition: color 0.2s;
}
.project-item:hover .proj-title-large { color: var(--acid); }
.proj-desc-text {
  font-size: 13px;
  line-height: 1.7;
  color: var(--gray5);
  font-weight: 300;
}
.proj-meta {
  padding-top: 6px;
  min-width: 160px;
  max-width: 200px;
}
.proj-badge-new {
  display: inline-block;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 4px 10px;
  background: var(--acid);
  color: var(--black);
  margin-bottom: 16px;
}
.proj-tags-list { display: flex; flex-direction: column; gap: 6px; }
.proj-tag-item {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray4);
}
.proj-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 6px;
  min-width: 90px;
}
.proj-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 10px 16px;
  border: 1px solid var(--gray3);
  color: var(--gray5);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  white-space: nowrap;
}
.proj-link-btn:hover { color: var(--acid); border-color: var(--acid); background: var(--acid-dim); }
.proj-link-btn.primary { border-color: var(--acid); color: var(--acid); }
.proj-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  border: 1px solid var(--gray3);
  background: var(--gray3);
  margin-top: 16px;
}
.proj-metric-cell {
  background: var(--black);
  padding: 12px;
  text-align: center;
}
.proj-metric-val {
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--acid);
  line-height: 1;
  display: block;
}
.proj-metric-key {
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray4);
  margin-top: 4px;
  display: block;
}
#certs {
  padding: 120px 40px;
  background: var(--gray1);
  border-bottom: 1px solid var(--gray3);
}
.certs-header {
  margin-bottom: 60px;
}
.certs-h2 {
  font-family: var(--f-display);
  font-size: clamp(40px, 6vw, 100px);
  text-transform: uppercase;
  line-height: 0.9;
  color: var(--white);
}
.certs-h2 span {
  -webkit-text-stroke: 1px var(--gray3);
  color: transparent;
  display: block;
}
.certs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--gray3);
  border: 1px solid var(--gray3);
}
.cert-item {
  background: var(--black);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-decoration: none;
  transition: background 0.2s;
  position: relative;
  overflow: hidden;
}
.cert-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 0;
  background: var(--acid);

<script>
/* CURSOR */
const cur = document.getElementById('cur');
const trail = document.getElementById('cur-trail');
let mx = 0, my = 0, tx = 0, ty = 0;
const isMobile = window.matchMedia('(max-width: 768px)').matches || ('ontouchstart' in window);

if (!isMobile) {
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cur.style.left = mx + 'px'; cur.style.top = my + 'px';
  });
  function animTrail() {
    tx += (mx - tx) * 0.14;
    ty += (my - ty) * 0.14;
    trail.style.left = tx + 'px'; trail.style.top = ty + 'px';
    requestAnimationFrame(animTrail);
  }
  animTrail();
  document.querySelectorAll('a, button, .skill-cat-header, .project-item').forEach(el => {
    el.addEventListener('mouseenter', () => {
      trail.style.width = '70px'; trail.style.height = '70px';
      trail.style.borderColor = 'rgba(184,255,71,0.6)';
    });
    el.addEventListener('mouseleave', () => {
      trail.style.width = '40px'; trail.style.height = '40px';
      trail.style.borderColor = 'rgba(184,255,71,0.25)';
    });
  });
}

/* SCROLL PROGRESS */
window.addEventListener('scroll', () => {
  const p = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
  document.getElementById('prog').style.width = p + '%';
}, { passive: true });

/* NAV HIDE ON SCROLL DOWN */
let lastSY = 0;
const navEl = document.querySelector('nav');
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  navEl.style.transform = (y > lastSY && y > 120) ? 'translateY(-100%)' : 'translateY(0)';
  navEl.style.transition = 'transform 0.4s cubic-bezier(0.4,0,0.2,1)';
  lastSY = y;
}, { passive: true });

/* MOBILE NAV */
document.getElementById('mob-nav-btn').addEventListener('click', () => {
  const n = document.getElementById('mob-nav');
  n.style.display = n.style.display === 'none' ? 'flex' : 'none';
});

/* SKILL ACCORDION */
function toggleSkill(el) {
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.skill-category.open').forEach(o => o.classList.remove('open'));
  if (!isOpen) el.classList.add('open');
}

/* GSAP SCROLL ANIMATIONS */
if (typeof gsap !== 'undefined') {
  gsap.registerPlugin(ScrollTrigger);

  const heroTl = gsap.timeline({ defaults: { ease: 'power4.out' } });
  heroTl
    .from('.hero-eyebrow', { y: 30, opacity: 0, duration: 0.9, delay: 0.2 })
    .from('#hl1', { y: '110%', duration: 0.9 }, '-=0.5')
    .from('#hl2', { y: '110%', duration: 0.9 }, '-=0.7')
    .from('#hl3', { y: '110%', duration: 0.9 }, '-=0.7')
    .from('.hero-desc', { y: 20, opacity: 0, duration: 0.7 }, '-=0.4')
    .from('.hero-stats', { y: 20, opacity: 0, duration: 0.6 }, '-=0.4')
    .from('.hero-cta', { y: 20, opacity: 0, duration: 0.6 }, '-=0.5')
    .from('.hero-counter-num', { opacity: 0, duration: 1 }, '-=1');

  document.querySelectorAll('.gsap-reveal').forEach((el, i) => {
    gsap.fromTo(el,
      { y: 50, opacity: 0 },
      {
        y: 0, opacity: 1, duration: 0.9,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: el,
          start: 'top 88%',
          toggleActions: 'play none none none'
        },
        delay: (i % 3) * 0.07
      }
    );
  });

  const marqueeTrack = document.querySelector('.marquee-track');
  const mSect = document.querySelector('.marquee-section');
  mSect.addEventListener('mouseenter', () => marqueeTrack.style.animationPlayState = 'paused');
  mSect.addEventListener('mouseleave', () => marqueeTrack.style.animationPlayState = 'running');

  gsap.to('.contact-bg-text', {
    y: -80,
    ease: 'none',
    scrollTrigger: {
      trigger: '#contact',
      start: 'top bottom',
      end: 'bottom top',
      scrub: 1
    }
  });
}

/* SMOOTH SCROLL */
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    const target = document.querySelector(a.getAttribute('href'));
    if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
});
</script>
